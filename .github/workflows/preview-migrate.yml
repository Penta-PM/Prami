# PRAMI-003 §4.3.6 preview 마이그레이션 게이트 (AC-362)
# - 새 마이그레이션(drizzle/**)이 있는 PR 에만, 라벨 `db-migration` 이 붙었을 때 Neon `preview` 브랜치(공용 1개)에 적용한다.
# - preview DB 는 모든 PR 이 공유하므로 concurrency 그룹으로 동시에 하나만 적용한다(취소하지 않음).
# - 포크 PR 은 시크릿을 받지 못하고, 받아서도 안 된다 — 같은 저장소 PR 만 실행한다.
name: preview-migrate

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths:
      - 'drizzle/**'

concurrency:
  group: preview-db-migration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrate-preview:
    name: preview DB 마이그레이션 (Neon preview, 직접 연결)
    if: >-
      contains(github.event.pull_request.labels.*.name, 'db-migration') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate (DATABASE_URL_UNPOOLED)
        run: pnpm db:migrate
        env:
          DB_DRIVER: neon
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PREVIEW_URL }}
          CHAT_LLM_ENABLED: 'false'
