# PRAMI-003 §4.3.6 preview 마이그레이션 게이트 (AC-362)
# - 새 마이그레이션(drizzle/**)이 있는 PR 에만, 라벨 `db-migration` 을 **붙이는 순간**에만 Neon `preview` 브랜치(공용 1개)에 적용한다.
#   라벨이 붙은 뒤의 push(synchronize)로는 실행하지 않는다 — 시크릿을 쓰는 PR 코드는 매번 사람이 확인하고 라벨을 다시 붙여야 한다
#   (보안 리뷰 M-1: 라벨 후 push 로 검토 안 된 코드가 DATABASE_URL_UNPOOLED 를 받는 경로 차단). 다시 적용: 라벨 제거 → 다시 붙이기.
#   GitHub Environment `preview` 에 Required reviewers 를 **반드시** 둔다(PR #26 L-S2) — 라벨(triage 권한)만으로는 PR 코드가
#   DATABASE_URL_UNPOOLED 를 받지 못하고, 승인자가 그 커밋을 확인한 뒤에만 실행된다(설정: docs/deploy/vercel.md §10, 체크리스트 C-3).
# - preview DB 는 모든 PR 이 공유하므로 concurrency 그룹으로 동시에 하나만 적용한다(취소하지 않음).
# - 포크 PR 은 시크릿을 받지 못하고, 받아서도 안 된다 — 같은 저장소 PR 만 실행한다.
name: preview-migrate

on:
  pull_request:
    types: [labeled]
    paths:
      - 'drizzle/**'

concurrency:
  group: preview-db-migration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrate-preview:
    name: preview DB 마이그레이션 (Neon preview, 직접 연결)
    if: >-
      github.event.label.name == 'db-migration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate (DATABASE_URL_UNPOOLED)
        run: pnpm db:migrate
        env:
          DB_DRIVER: neon
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PREVIEW_URL }}
          CHAT_LLM_ENABLED: 'false'
