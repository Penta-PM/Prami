# PRAMI-003 §4.3.10 preview 스모크 (AC-361·AC-362)
# Vercel Git 연동이 preview 배포를 마치면 deployment_status(success) 이벤트가 온다 → 그 배포 URL 에 비인증 스모크 8항목.
# 보안 (PR #26 S-1): deployment_status 는 배포 커밋(PR 브랜치 head)의 워크플로·코드로 실행된다(GITHUB_SHA = 배포 커밋).
# - 스모크 코드는 PR 코드가 아니라 **기본 브랜치**를 체크아웃해 실행한다(pnpm install 라이프사이클·스모크 코드 = 신뢰 코드).
# - 배포 보호 우회 시크릿 VERCEL_AUTOMATION_BYPASS_SECRET 은 저장소 시크릿이 아니라 GitHub Environment `preview-smoke` 의
#   시크릿으로만 둔다 — Required reviewers 승인 전에는 잡이 시크릿을 받지 못한다. PR 쪽에서 이 YAML 을 고쳐 environment 를
#   빼면 시크릿 자체가 없다(설정은 docs/deploy/vercel.md §10). 우회 시크릿은 Vercel 이 알려준 배포 URL 이면서
#   vars.VERCEL_PREVIEW_HOST_PATTERN(`<프로젝트>-*-<팀>.vercel.app`)에 맞는 호스트에만 보낸다(L-S1).
# - 수동 실행(workflow_dispatch)은 고정 preview 호스트 등 임의 URL 을 대상으로 하고 우회 시크릿을 보내지 않는다.
name: preview-smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: '스모크 대상 URL (https://…)'
        required: true

concurrency:
  group: preview-smoke-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  smoke:
    name: preview 스모크 (비인증 8항목)
    # Vercel 의 환경 이름은 `Preview` 또는 `Preview – <프로젝트>` 일 수 있다 (F-21 — PR-5 에서 실제 값 기록)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    environment: preview-smoke
    timeout-minutes: 10
    steps:
      # 신뢰 코드: 배포 커밋이 아니라 기본 브랜치의 스모크 코드. 토큰은 작업 폴더에 남기지 않는다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Smoke
        run: pnpm smoke
        env:
          SMOKE_URL: ${{ github.event.inputs.url || github.event.deployment_status.target_url }}
          # 우회 시크릿은 Vercel 이 알려준 배포 URL 에만 보낸다 — 수동 입력 URL 로는 보내지 않는다(임의 호스트 유출 방지)
          SMOKE_BYPASS_SECRET: ${{ github.event_name == 'deployment_status' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          SMOKE_BYPASS_HOST_PATTERN: ${{ vars.VERCEL_PREVIEW_HOST_PATTERN }}
