name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # 스펙 §4.9.2 CI 열: 단위 테스트는 PGlite, 통합 테스트는 아래 integration 잡의 Postgres service container
  DB_DRIVER: pglite
  PGLITE_DATA_DIR: memory://

jobs:
  secrets:
    # AC-96: 추적 파일에 원격 DB 자격 증명·AUTH_SECRET 값·OAuth 시크릿이 없는지 (scripts/secret-scan.ts)
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm check:secrets

  quality:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # package.json 의 packageManager 버전을 사용

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests (coverage ≥ 80%)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: 정적 프리렌더 페이지 없음 (CSP nonce, PR-11a QA M-1)
        run: pnpm check:prerender

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  integration:
    name: integration (PostgreSQL 16 service)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prami
          POSTGRES_PASSWORD: prami
          POSTGRES_DB: prami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prami -d prami"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_DRIVER: pg
      DATABASE_URL: postgres://prami:prami@localhost:5432/prami
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate (drizzle/*.sql → Postgres)
        run: pnpm db:migrate

      - name: Seed (픽스처 ADMIN·USER, 공지, audit user.seed)
        run: pnpm seed

      - name: Integration tests (schema snapshot · seed)
        run: pnpm test:integration

  e2e:
    name: e2e (Playwright · PostgreSQL 16 · AUTH_TEST_MODE)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prami
          POSTGRES_PASSWORD: prami
          POSTGRES_DB: prami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prami -d prami"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # playwright.config.ts 가 나머지 E2E 환경(AUTH_TEST_MODE 등)을 webServer·globalSetup 에 주입한다.
      # AUTH_TEST_MODE 는 production 빌드에서 거부되므로(AC-07) E2E 는 next dev 로 띄운다.
      E2E_DATABASE_URL: postgres://prami:prami@localhost:5432/prami
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (globalSetup 이 db:migrate → seed 후 next dev 기동)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
