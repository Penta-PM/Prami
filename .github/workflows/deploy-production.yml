# PRAMI-003 §4.3.1·§4.3.6 운영 배포 (AC-362)
# 순서(한 잡): 점검 모드 판정 → 마이그레이션(Neon main, 직접 연결) → vercel build --prod → vercel deploy --prebuilt --prod → 도메인 할당 확인
#   → 프로덕션 스모크 → 실패 시 롤백.
# - 수동 실행(workflow_dispatch, 브랜치 `main`)만 한다 (PR #26 S1-b). push·PR 이벤트로는 돌지 않는다 — `integration/prami-003` → `main` 머지 뒤
#   운영자가 Actions 에서 Run workflow 를 누른다(런북 R-1). 다른 브랜치를 고르면 잡 if 가 막는다.
# - 운영 시크릿의 위치(GitHub 플랜에 따라 Environment 시크릿 또는 저장소 시크릿)와 남는 위험은 docs/deploy/github-plan.md.
#   environment: production 은 플랜이 허용하면 Required reviewers·Deployment branches(main) 를 건다.
# - 시크릿은 secrets.* → 단계 env 로만 넘기고 run: 에서 값을 출력하지 않는다 (Actions 가 마스킹하지만 echo 자체를 금지).
# - 점검 모드(MAINTENANCE_MODE, 런북 §0.3·R-3) 켜기·끄기도 이 워크플로(maintenance 입력)로 한다 (PR #26 D-1):
#   Vercel production env 의 MAINTENANCE_MODE 와 입력이 다르면 **마이그레이션 전에** 멈추고(L2-2), 점검 모드 배포는 점검 스모크(④~⑦ 503 기대)를
#   돌리며 자동 롤백하지 않는다 — 직전 배포는 점검 전 env 로 고정돼 있어 롤백하면 DB 복구 중 쓰기 차단이 풀린다.
# - 롤백 상태(Instant Rollback 뒤 자동 할당 꺼짐)면 새 배포는 Staged 로 남는다 — 도메인 할당 확인에서 멈추고 런북 R-2 5단계로 promote 한다(D3-N1·L2-1).
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Vercel production 의 MAINTENANCE_MODE 기대값 (점검 켜기·유지 = true, 끄기·평시 = false) — 다르면 배포 중단'
        type: choice
        options: ['false', 'true']
        default: 'false'

# 배포는 한 번에 하나만, 진행 중인 배포를 취소하지 않는다 (마이그레이션 중단 방지)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  VERCEL_CLI_VERSION: '62.1.0'

jobs:
  deploy:
    name: 1) 점검 판정 · 2) 마이그레이션 · 3) 빌드 · 4) 배포
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous: ${{ steps.previous.outputs.url }}
      maintenance: ${{ steps.mode.outputs.maintenance }}
    # Vercel 토큰은 쓰는 단계 env 에만 둔다 — pnpm install·npm install 의 패키지 설치 스크립트는 토큰을 받지 않는다 (보안 리뷰 M-1)
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      # 캐시 없음 — 시크릿 잡은 다른 실행이 만든 pnpm store 를 복원하지 않는다 (PR #26 L2-8)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # 롤백 기준점: 운영 도메인이 **지금 가리키는** 배포(Vercel REST GET /v4/aliases — I2-8). 토큰은 헤더로만, 응답에서 url 만 꺼낸다.
      # pipefail(shell: bash) — API 실패를 빈 값으로 삼켜 롤백이 조용히 빠지지 않게 실패로 멈춘다 (L2-9). 별칭 없음(404 = 첫 배포)만 경고
      - name: 직전 production 배포 기록
        id: previous
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          host=$(printf '%s' "$PRODUCTION_URL" | sed -E 's#^https://##; s#/.*$##')
          if [ -z "$host" ]; then
            echo "::error::vars.PRODUCTION_URL 이 비어 있습니다"
            exit 1
          fi
          team_query=""
          case "$VERCEL_ORG_ID" in team_*) team_query="?teamId=${VERCEL_ORG_ID}" ;; esac
          # 응답은 임시 파일에 두고 어떤 경로로 끝나도 지운다 (보안 리뷰 L-5)
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v4/aliases/${host}${team_query}")
          previous=""
          if [ "$code" = "200" ]; then
            previous=$(jq -r '.deployment.url // empty' "$body" | sed -E 's#^https://##')
          elif [ "$code" = "404" ]; then
            echo "::warning::운영 도메인 별칭이 아직 없습니다(첫 배포) — 이번 실행은 자동 롤백 대상이 없습니다"
          else
            echo "::error::Vercel 별칭 조회 실패 (HTTP ${code}) — 배포 중단"
            exit 1
          fi
          if [ "$code" = "200" ] && [ -z "$previous" ]; then
            echo "::error::별칭 응답에 deployment.url 이 없습니다 — 배포 중단"
            exit 1
          fi
          echo "url=${previous}" >> "$GITHUB_OUTPUT"

      - name: Vercel env 가져오기 (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 점검 모드 판정 (PR #26 D-1, L2-2) — 마이그레이션 전에 배포될 env 의 MAINTENANCE_MODE 가 실행 입력과 같아야 진행한다.
      # 값은 true/false 로만 출력한다. MAINTENANCE_MODE 는 유형 Config 여야 pull 로 읽힌다(Secret 은 값을 주지 않음 — vercel.md §3, L2-7).
      - name: 점검 모드 판정 (MAINTENANCE_MODE)
        id: mode
        shell: bash
        env:
          EXPECTED: ${{ inputs.maintenance || 'false' }}
        run: |
          file=.vercel/.env.production.local
          test -f "$file"
          value=$(sed -n 's/^MAINTENANCE_MODE=//p' "$file" | tr -d "\"' \r" | tr '[:upper:]' '[:lower:]')
          # 키는 있는데 값이 비면 Secret 이라 pull 이 값을 주지 않은 것 — false 로 읽지 않고 멈춘다 (fail-closed)
          if grep -q '^MAINTENANCE_MODE=' "$file" && [ -z "$value" ]; then
            echo "::error::MAINTENANCE_MODE 값을 읽지 못했습니다 — 유형을 Config 로 두세요 (vercel.md §3)"
            exit 1
          fi
          case "$value" in
            true|1|yes) maintenance=true ;;
            ''|false|0|no) maintenance=false ;;
            *) echo "::error::MAINTENANCE_MODE 값을 해석할 수 없습니다 (true/false)"; exit 1 ;;
          esac
          if [ "$maintenance" != "$EXPECTED" ]; then
            echo "::error::Vercel production MAINTENANCE_MODE=${maintenance} 가 실행 입력 maintenance=${EXPECTED} 와 다릅니다 — 마이그레이션·배포 전 중단 (런북 §0.3)"
            exit 1
          fi
          echo "maintenance=${maintenance}" >> "$GITHUB_OUTPUT"

      # 마이그레이션이 실패하면 이 잡의 뒤 단계(빌드·배포)는 실행되지 않는다
      - name: Migrate (DATABASE_URL_UNPOOLED)
        run: pnpm db:migrate
        env:
          DB_DRIVER: neon
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          # env.ts 는 neon 드라이버에 DATABASE_URL 을 요구한다 — 마이그레이션은 UNPOOLED 를 우선 사용한다(scripts/migrate.ts)
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          CHAT_LLM_ENABLED: 'false'

      - name: Build (vercel build --prod)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          # §4.3.2 APP_RELEASE: 헬스·로그의 release 필드 = 커밋 SHA
          APP_RELEASE: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy (vercel deploy --prebuilt --prod)
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          # 출력은 배포 URL 한 줄이어야 한다 — 다른 형식이면 다음 단계에 넘기지 않는다 (보안 리뷰 L-4)
          if [[ ! "$url" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::vercel deploy 출력이 배포 URL 형식이 아닙니다 — 중단"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "배포 URL: ${url}"

      # 운영 도메인이 방금 만든 배포를 가리키는지 배포 ID 로 확인한다 (D3-N1·L2-1). 롤백 상태면 새 배포는 Staged 로 남아 도메인이 옛 배포를
      # 가리킨다 — 같은 SHA 재배포면 헬스 release 까지 같아 스모크가 거짓 통과하므로 여기서 실패로 멈춘다(스모크·자동 롤백 미실행).
      - name: 도메인 할당 확인 (Staged 감지)
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          host=$(printf '%s' "$PRODUCTION_URL" | sed -E 's#^https://##; s#/.*$##')
          deploy_host=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https://##; s#/.*$##')
          team_query=""
          case "$VERCEL_ORG_ID" in team_*) team_query="?teamId=${VERCEL_ORG_ID}" ;; esac
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          deployment_id=$(curl -fsS -H "$auth" "https://api.vercel.com/v13/deployments/${deploy_host}${team_query}" | jq -r '.id // empty')
          test -n "$deployment_id"
          for _ in 1 2 3 4 5 6; do
            assigned=$(curl -fsS -H "$auth" "https://api.vercel.com/v4/aliases/${host}${team_query}" | jq -r '.deploymentId // empty')
            if [ "$assigned" = "$deployment_id" ]; then
              echo "운영 도메인 = 이번 배포"
              exit 0
            fi
            sleep 5
          done
          echo "::error::운영 도메인이 이번 배포(${DEPLOY_URL})를 가리키지 않습니다 — 롤백 상태(자동 할당 꺼짐)라 Staged 로 남았습니다. 런북 R-2 5단계: 이 배포 URL 을 Undo Rollback 또는 vercel promote 로 올리세요"
          exit 1

  smoke:
    name: 5) 프로덕션 스모크 (비인증 + 헬스)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Smoke (운영 도메인)
        run: pnpm smoke
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_EXPECT_RELEASE: ${{ github.sha }}
          # 점검 모드 배포면 ④~⑦ 점검 503 을 기대한다 — 쓰기 차단이 실제로 걸렸는지 확인 (PR #26 D-1)
          SMOKE_MAINTENANCE: ${{ needs.deploy.outputs.maintenance }}

  rollback:
    name: 6) 실패 시 롤백 (직전 배포로)
    needs: [deploy, smoke]
    # 점검 모드 배포는 자동 롤백하지 않는다 (PR #26 D-1 — 직전 배포는 점검 전 env 라 쓰기 차단이 풀린다). 사람이 런북 R-2·R-3 로 판단.
    # deploy 잡이 실패했으면(마이그레이션·도메인 할당 확인 포함) 롤백하지 않는다 — 스모크 실패일 때만
    if: ${{ github.ref == 'refs/heads/main' && failure() && needs.deploy.result == 'success' && needs.deploy.outputs.previous != '' && needs.deploy.outputs.maintenance != 'true' }}
    runs-on: ubuntu-latest
    # 승인 대기 없이 바로 롤백한다 — Vercel 시크릿 3개만 가진 별도 Environment(플랜이 허용하면 Deployment branches main 만) (보안 리뷰 L-2)
    environment: production-rollback
    timeout-minutes: 10
    env:
      PREVIOUS_URL: ${{ needs.deploy.outputs.previous }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # 롤백 전 운영 도메인 재확인 — 해당하면 롤백하지 않고 실패로 남겨 사람이 런북을 따른다
      # (D-1) 점검 503(MAINTENANCE)이면: env 판정이 빗나갔어도 점검 중 배포를 점검 전 배포로 되돌리지 않는다
      # (D-3) 헬스 release 가 이번 커밋이 아니면: 도메인이 새 배포를 가리키지 않는다 — 롤백해도 소용없으므로 멈춘다 → 런북 R-2 5단계
      # 운영에 닿지 않으면(연결 실패·타임아웃) 롤백을 진행한다 — 점검 모드 배포는 잡 if 에서 이미 빠졌고, 닿지 않는 운영은 롤백이 처방이다.
      # PRODUCTION_URL 이 비면 판정할 수 없으므로 멈춘다(설정 오류, fail-closed).
      - name: 롤백 전 확인 (점검 모드 · 도메인 할당)
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::vars.PRODUCTION_URL 이 비어 있습니다 — 자동 롤백 생략"
            exit 1
          fi
          chat_code=$(curl -s --max-time 10 -X POST -H 'content-type: application/json' --data '{}' "${PRODUCTION_URL}/api/chat" | jq -r '.error.code // empty' 2>/dev/null || true)
          if [ "$chat_code" = "MAINTENANCE" ]; then
            echo "::error::운영이 점검 모드입니다 — 자동 롤백 생략 (런북 R-3, PR #26 D-1)"
            exit 1
          fi
          release=$(curl -s --max-time 10 "${PRODUCTION_URL}/api/health" | jq -r '.release // empty' 2>/dev/null || true)
          if [ -n "$release" ] && [ "$release" != "$GITHUB_SHA" ]; then
            echo "::error::운영 도메인이 이번 배포를 가리키지 않습니다 — 롤백 상태(자동 할당 꺼짐) 의심, 자동 롤백 생략 (런북 R-2 5단계)"
            exit 1
          fi

      - name: Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # 스키마는 그대로 둔다 (forward-only · expand/contract, 런북 R-2)
      - name: vercel rollback
        run: vercel rollback "https://${PREVIOUS_URL}" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
