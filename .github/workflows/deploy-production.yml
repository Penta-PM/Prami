# PRAMI-003 §4.3.1·§4.3.6 운영 배포 (AC-362)
# 순서: 마이그레이션(Neon main, 직접 연결) → vercel build --prod → vercel deploy --prebuilt --prod → 프로덕션 스모크 → 실패 시 롤백.
# - main 에서만 실행한다 (integration/prami-003 → main 머지 1회가 트리거, §6.0). 다른 브랜치의 수동 실행은 job if 가 막는다.
# - environment: production 은 GitHub 에서 "Required reviewers" 1인 이상으로 설정한다(사용자 제공 항목) — 승인 전에는 어떤 잡도 시크릿을 받지 않는다.
# - 시크릿은 secrets.* → 단계 env 로만 넘기고 run: 에서 값을 출력하지 않는다 (Actions 가 마스킹하지만 echo 자체를 금지).
# - 점검 모드(MAINTENANCE_MODE, 런북 §0.3·R-3) 켜기·끄기도 이 워크플로(workflow_dispatch, maintenance 입력)로 한다 (PR #26 D-1):
#   Vercel production env 의 MAINTENANCE_MODE 와 입력이 다르면 배포 전에 멈추고, 점검 모드 배포는 점검 스모크(④~⑦ 503 기대)를 돌리며
#   자동 롤백하지 않는다 — 직전 배포는 점검 전 env 로 고정돼 있어 롤백하면 DB 복구 중 쓰기 차단이 풀린다.
name: deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Vercel production 의 MAINTENANCE_MODE 기대값 (점검 켜기·유지 = true, 끄기·평시 = false) — 다르면 배포 중단'
        type: choice
        options: ['false', 'true']
        default: 'false'

# 배포는 한 번에 하나만, 진행 중인 배포를 취소하지 않는다 (마이그레이션 중단 방지)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  VERCEL_CLI_VERSION: '62.1.0'

jobs:
  migrate:
    name: 1) DB 마이그레이션 (Neon main, 직접 연결)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate (DATABASE_URL_UNPOOLED)
        run: pnpm db:migrate
        env:
          DB_DRIVER: neon
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          # env.ts 는 neon 드라이버에 DATABASE_URL 을 요구한다 — 마이그레이션은 UNPOOLED 를 우선 사용한다(scripts/migrate.ts)
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          CHAT_LLM_ENABLED: 'false'

  deploy:
    name: 2) 빌드 · 3) 배포
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous: ${{ steps.previous.outputs.url }}
      maintenance: ${{ steps.mode.outputs.maintenance }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # 롤백 기준점: 지금 production 인 배포 URL (Vercel REST API — 토큰은 헤더로만, 응답에서 url 만 꺼낸다)
      - name: 직전 production 배포 기록
        id: previous
        run: |
          team_query=""
          case "$VERCEL_ORG_ID" in team_*) team_query="&teamId=${VERCEL_ORG_ID}" ;; esac
          previous=$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&state=READY&limit=1${team_query}" \
            | jq -r '.deployments[0].url // empty')
          echo "url=${previous}" >> "$GITHUB_OUTPUT"

      - name: Vercel env 가져오기 (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # 점검 모드 판정 (PR #26 D-1) — 배포될 env 의 MAINTENANCE_MODE 가 실행 입력(push 는 false)과 같아야 진행한다.
      # 값은 true/false 로만 출력한다. MAINTENANCE_MODE 는 Sensitive 가 아닌 일반 변수여야 pull 로 읽힌다(vercel.md §3).
      - name: 점검 모드 판정 (MAINTENANCE_MODE)
        id: mode
        env:
          EXPECTED: ${{ inputs.maintenance || 'false' }}
        run: |
          file=.vercel/.env.production.local
          test -f "$file"
          value=$(sed -n 's/^MAINTENANCE_MODE=//p' "$file" | tr -d "\"' \r" | tr '[:upper:]' '[:lower:]')
          # 키는 있는데 값이 비면 Sensitive 라 pull 이 값을 주지 않은 것 — false 로 읽지 않고 멈춘다 (fail-closed)
          if grep -q '^MAINTENANCE_MODE=' "$file" && [ -z "$value" ]; then
            echo "::error::MAINTENANCE_MODE 값을 읽지 못했습니다 — Sensitive 가 아닌 일반 변수로 두세요 (vercel.md §2)"
            exit 1
          fi
          case "$value" in
            true|1|yes) maintenance=true ;;
            ''|false|0|no) maintenance=false ;;
            *) echo "::error::MAINTENANCE_MODE 값을 해석할 수 없습니다 (true/false)"; exit 1 ;;
          esac
          if [ "$maintenance" != "$EXPECTED" ]; then
            echo "::error::Vercel production MAINTENANCE_MODE=${maintenance} 가 실행 입력 maintenance=${EXPECTED} 와 다릅니다 — 배포 중단 (런북 §0.3)"
            exit 1
          fi
          echo "maintenance=${maintenance}" >> "$GITHUB_OUTPUT"

      - name: Build (vercel build --prod)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          # §4.3.2 APP_RELEASE: 헬스·로그의 release 필드 = 커밋 SHA
          APP_RELEASE: ${{ github.sha }}

      - name: Deploy (vercel deploy --prebuilt --prod)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  smoke:
    name: 4) 프로덕션 스모크 (비인증 + 헬스)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Smoke (운영 도메인)
        run: pnpm smoke
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_EXPECT_RELEASE: ${{ github.sha }}
          # 점검 모드 배포면 ④~⑦ 점검 503 을 기대한다 — 쓰기 차단이 실제로 걸렸는지 확인 (PR #26 D-1)
          SMOKE_MAINTENANCE: ${{ needs.deploy.outputs.maintenance }}

  rollback:
    name: 5) 실패 시 롤백 (직전 배포 승격)
    needs: [deploy, smoke]
    # 점검 모드 배포는 자동 롤백하지 않는다 (PR #26 D-1 — 직전 배포는 점검 전 env 라 쓰기 차단이 풀린다). 사람이 런북 R-2·R-3 로 판단
    if: ${{ failure() && needs.deploy.result == 'success' && needs.deploy.outputs.previous != '' && needs.deploy.outputs.maintenance != 'true' }}
    runs-on: ubuntu-latest
    # 승인 대기 없이 바로 롤백한다 — Vercel 시크릿 3개만 가진 별도 Environment(Required reviewers 없음, 배포 브랜치 main 만) (보안 리뷰 L-2)
    environment: production-rollback
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PREVIOUS_URL: ${{ needs.deploy.outputs.previous }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # 롤백 전 운영 도메인 재확인 — 해당하면 롤백하지 않고 실패로 남겨 사람이 런북을 따른다
      # (D-1) 점검 503(MAINTENANCE)이면: env 판정이 빗나갔어도 점검 중 배포를 점검 전 배포로 되돌리지 않는다
      # (D-3) 헬스 release 가 이번 커밋이 아니면: 도메인이 새 배포를 가리키지 않는다(Instant Rollback 뒤 자동 할당 꺼짐 등) —
      #       롤백해도 소용없고 다음 배포마다 롤백이 반복되므로 멈춘다 → 런북 R-2 5단계(Undo Rollback / vercel promote)
      # 운영에 닿지 않으면(연결 실패·타임아웃) 롤백을 진행한다 — 점검 모드 배포는 잡 if 에서 이미 빠졌고, 닿지 않는 운영은 롤백이 처방이다.
      # PRODUCTION_URL 이 비면 판정할 수 없으므로 멈춘다(설정 오류, fail-closed).
      - name: 롤백 전 확인 (점검 모드 · 도메인 할당)
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::vars.PRODUCTION_URL 이 비어 있습니다 — 자동 롤백 생략"
            exit 1
          fi
          chat_code=$(curl -s --max-time 10 -X POST -H 'content-type: application/json' --data '{}' "${PRODUCTION_URL}/api/chat" | jq -r '.error.code // empty' 2>/dev/null || true)
          if [ "$chat_code" = "MAINTENANCE" ]; then
            echo "::error::운영이 점검 모드입니다 — 자동 롤백 생략 (런북 R-3, PR #26 D-1)"
            exit 1
          fi
          release=$(curl -s --max-time 10 "${PRODUCTION_URL}/api/health" | jq -r '.release // empty' 2>/dev/null || true)
          if [ -n "$release" ] && [ "$release" != "$GITHUB_SHA" ]; then
            echo "::error::운영 도메인이 이번 배포를 가리키지 않습니다 — 롤백 상태(자동 할당 꺼짐) 의심, 자동 롤백 생략 (런북 R-2 5단계)"
            exit 1
          fi

      - name: Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # 스키마는 그대로 둔다 (forward-only · expand/contract, 런북 R-2)
      - name: vercel rollback
        run: vercel rollback "https://${PREVIOUS_URL}" --token="$VERCEL_TOKEN"
