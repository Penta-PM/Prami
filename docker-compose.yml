# 로컬 개발용 PostgreSQL 16 (스펙 §4.9). Neon 프로젝트가 준비되기 전까지 DB_DRIVER=pg 로 이 인스턴스를 사용한다.
# 자격 증명은 셸 환경변수로 덮어쓸 수 있고, 기본값은 로컬 컨테이너 전용이다 (운영 값 금지).
#
#   docker compose up -d          # 기동
#   docker compose down           # 중지 (데이터 유지)
#   docker compose down -v        # 중지 + 데이터 삭제
#
# 연결 문자열 예: postgres://prami:prami@localhost:5432/prami  → .env.local 의 DATABASE_URL

name: prami

services:
  postgres:
    image: postgres:16
    container_name: prami-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prami}
      POSTGRES_DB: ${POSTGRES_DB:-prami}
    volumes:
      - prami-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prami} -d ${POSTGRES_DB:-prami}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prami-postgres-data:
